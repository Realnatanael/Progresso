services:
  - type: web
    name: progresso
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w client
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.0-flash
